name: Release

# Push a SemVer tag (vX.Y.Z) to publish a GitHub Release with the built app attached.
# The tag must match package.json and have a CHANGELOG.md section.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)release, e.g. v1.0.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Check tag, package.json and changelog agree
        run: node scripts/check-version.mjs "$TAG"

      - name: Lint, types, rules and unit tests
        run: npm run check

      - name: Build
        id: build
        env:
          RELEASE_CHANNEL: stable
        run: |
          npm run build
          VERSION="${TAG#v}"
          BUILD="$(git rev-list --count HEAD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

      - name: End-to-end tests
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --trace off

      - name: Package
        id: package
        run: |
          NAME="spendtally-${{ steps.build.outputs.version }}-build.${{ steps.build.outputs.build }}-web"
          mkdir -p release
          (cd dist && zip -qr "../release/$NAME.zip" .)
          cp docs/images/sample-packet.pdf "release/spendtally-${{ steps.build.outputs.version }}-sample-packet.pdf"
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -la release
          cat release/SHA256SUMS.txt

      - name: Release notes
        run: |
          {
            node scripts/release-notes.mjs "$TAG"
            echo ""
            echo "---"
            echo ""
            echo "**Build ${{ steps.build.outputs.build }}** · commit \`${GITHUB_SHA::7}\` · Node $(node -v)"
            echo ""
            echo "**Install:** open the [live app](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/) and choose *Add to Home Screen* / *Install*. To self-host, unzip the \`-web.zip\` onto any static web server (HTTPS required for offline mode)."
          } > notes.md
          cat notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "$TAG" in *-*) PRERELEASE="--prerelease" ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
            gh release edit "$TAG" --notes-file notes.md --title "Spendtally $TAG"
          else
            gh release create "$TAG" release/* --title "Spendtally $TAG" --notes-file notes.md --verify-tag $PRERELEASE
          fi
