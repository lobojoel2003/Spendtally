name: Release

# Two ways to publish a release:
#  1. Push a SemVer tag:      git tag -a v1.2.0 -m "Spendtally 1.2.0" && git push origin v1.2.0
#  2. Actions → Release → Run workflow, enter the tag (e.g. v1.2.0). If the tag doesn't exist yet,
#     it is created (annotated) on the selected branch's commit once every check passes.
# Either way the tag must match package.json and have a CHANGELOG.md section.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, e.g. v1.0.0 (created on the selected branch if it doesn't exist)
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for the build number, plus tags

      - name: Resolve tag
        id: tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a SemVer tag like v1.2.3"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            git checkout -q "refs/tags/$TAG"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG will be created on $(git rev-parse --short HEAD) after all checks pass."
          fi

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Check tag, package.json and changelog agree
        run: node scripts/check-version.mjs "$TAG"

      - name: Lint, types, rules and unit tests
        run: npm run check

      - name: Build
        id: build
        env:
          RELEASE_CHANNEL: stable
        run: |
          npm run build
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: End-to-end tests
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --trace off

      - name: Package
        run: |
          NAME="spendtally-${{ steps.build.outputs.version }}-build.${{ steps.build.outputs.build }}-web"
          mkdir -p release
          (cd dist && zip -qr "../release/$NAME.zip" .)
          cp docs/images/sample-packet.pdf "release/spendtally-${{ steps.build.outputs.version }}-sample-packet.pdf"
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -la release
          cat release/SHA256SUMS.txt

      - name: Release notes
        run: |
          {
            node scripts/release-notes.mjs "$TAG"
            echo ""
            echo "---"
            echo ""
            echo "**Build ${{ steps.build.outputs.build }}** · commit \`${{ steps.build.outputs.sha }}\` · Node $(node -v)"
            echo ""
            echo "**Install:** open the [live app](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/) and choose *Add to Home Screen* / *Install*. To self-host, unzip the \`-web.zip\` onto any static web server (HTTPS required for offline mode)."
          } > notes.md
          cat notes.md

      - name: Create tag
        if: steps.tag.outputs.exists == 'false'
        run: |
          # Attribute the tag to the person who started the run.
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git tag -a "$TAG" -m "Spendtally $TAG (build ${{ steps.build.outputs.build }})" -m "See CHANGELOG.md."
          git push origin "refs/tags/$TAG"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS="--latest"
          case "$TAG" in *-*) FLAGS="--prerelease --latest=false" ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
            gh release edit "$TAG" --notes-file notes.md --title "Spendtally $TAG"
          else
            gh release create "$TAG" release/* --title "Spendtally $TAG" --notes-file notes.md --verify-tag $FLAGS
          fi
          {
            echo "### Released $TAG"
            echo ""
            echo "- Build: \`${{ steps.build.outputs.build }}\`"
            echo "- Commit: \`${{ steps.build.outputs.sha }}\`"
            echo "- $(gh release view "$TAG" --json url --jq .url)"
          } >> "$GITHUB_STEP_SUMMARY"
