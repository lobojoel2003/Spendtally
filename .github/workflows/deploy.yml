name: Deploy to GitHub Pages

# Continuous delivery: every push to main is tested, built and published to
# https://<owner>.github.io/<repo>/ — once Pages is switched on
# (Settings → Pages → Build and deployment → Source: GitHub Actions).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build for Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Is GitHub Pages on?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null | grep -q workflow; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=GitHub Pages is not set up::Open Settings → Pages and set Source to 'GitHub Actions', then re-run this workflow to publish the app."
          fi
      - uses: actions/setup-node@v7
        if: steps.pages.outputs.enabled == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.pages.outputs.enabled == 'true'
        run: npm ci
      - if: steps.pages.outputs.enabled == 'true'
        run: npm run check
      - name: Build
        if: steps.pages.outputs.enabled == 'true'
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          RELEASE_CHANNEL: stable
      - uses: actions/configure-pages@v6
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: dist

  deploy:
    name: Publish
    needs: build
    if: needs.build.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
