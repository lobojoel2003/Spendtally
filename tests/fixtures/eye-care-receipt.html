<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        background: #fff;
      }
      .page {
        width: 760px;
        padding: 44px 48px;
        box-sizing: border-box;
        font-family: Georgia, serif;
        font-size: 24px;
        color: #1a1a1a;
      }
      .name {
        font-size: 36px;
        font-weight: 700;
        color: #6b2c91;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 22px;
      }
      td {
        padding: 8px 0;
        border-bottom: 1px solid #ccc;
      }
      td.r {
        text-align: right;
      }
      .paid {
        margin-top: 26px;
        font-size: 30px;
        font-weight: 700;
        color: #1d7a3a;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="name">Capital Eye Care Associates</div>
      <div>88 Western Ave, Albany NY 12203</div>
      <div style="margin-top: 20px">Date of Service: 11/06/2026</div>
      <div>Patient: Rose Alvarez</div>
      <table>
        <tr>
          <td>Eye exam</td>
          <td class="r">$95.00</td>
        </tr>
        <tr>
          <td>Eyeglass lenses</td>
          <td class="r">$90.00</td>
        </tr>
        <tr>
          <td><b>Total</b></td>
          <td class="r"><b>$185.00</b></td>
        </tr>
      </table>
      <div class="paid">PAID IN FULL — Amount Paid $185.00</div>
      <div>Visa ending 4421 · Thank you</div>
    </div>
  </body>
</html>
